<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gammy - Habit Tracker that Changes Your Life with Real-Time Progress</title>
    <meta name="description" content="Habit tracker which will change your life with real-time progress, account-isolated cloud synchronization, and 24/7 behavioral AI coaching." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#090D15" />
    <script>
      // Global error handlers to capture and suppress errors injected by third-party browser extensions
      window.addEventListener('error', function(event) {
        if (
          (event.message && (
            event.message.indexOf('browser extension') !== -1 ||
            event.message.indexOf('extension') !== -1
          )) ||
          (event.filename && event.filename.indexOf('chrome-extension') !== -1)
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        if (
          event.reason && 
          event.reason.message && (
            event.reason.message.indexOf('browser extension') !== -1 ||
            event.reason.message.indexOf('extension') !== -1
          )
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
